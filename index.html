<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Masuk · SPK Prioritas Pembangunan Desa Pekutatan</title>
  <meta name="description" content="Sistem Pendukung Keputusan Prioritas Pembangunan Infrastruktur Desa Pekutatan berbasis Web GIS dan metode AHP.">
  <link rel="icon" href="./assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <div class="login-page">
    <section class="login-brand" aria-label="Tentang aplikasi">
      <div>
        <img src="./assets/logo.svg" alt="Logo aplikasi" width="64" height="64">
        <h1>SPK PRIORITAS PEMBANGUNAN<br>DESA PEKUTATAN</h1>
      </div>
      <div class="chips" aria-hidden="true">
        <span class="chip">Metode AHP</span>
        <span class="chip">Web GIS</span>
        <span class="chip">Prototype Penelitian</span>
      </div>
    </section>

    <section class="login-panel">
      <div class="login-box">
        <h2>Selamat datang</h2>
        <p class="muted">Pilih cara masuk untuk melanjutkan.</p>

        <div class="seg" role="tablist" aria-label="Jenis pengguna">
          <button type="button" role="tab" id="tab-admin" aria-selected="true" aria-controls="pane-admin">Admin</button>
          <button type="button" role="tab" id="tab-user" aria-selected="false" aria-controls="pane-user">Pengunjung</button>
        </div>

        <!-- Admin: login Supabase Auth -->
        <div id="pane-admin" role="tabpanel" aria-labelledby="tab-admin">
          <form id="form-login" autocomplete="on" novalidate>
            <div class="field">
              <label for="login-email">Email admin</label>
              <input type="email" id="login-email" autocomplete="username" placeholder="Masukkan Email" required>
            </div>
            <div class="field">
              <label for="login-pass">Password</label>
              <input type="password" id="login-pass" autocomplete="current-password" required>
              <div class="err" id="login-err" role="alert"></div>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%">Masuk sebagai Admin</button>
            <button type="button" class="btn btn-ghost btn-sm" id="btn-forgot" style="width:100%">Lupa password?</button>
          </form>

          <!-- Admin: buat password baru setelah klik tautan reset dari email -->
          <form id="form-recovery" class="hidden" autocomplete="off" novalidate>
            <div class="alert alert-info" style="margin:0">
              <div><strong>Buat password baru</strong><p>Masukkan password baru untuk akun admin Anda.</p></div>
            </div>
            <div class="field">
              <label for="rec-pass">Password baru (min. 6 karakter)</label>
              <input type="password" id="rec-pass" autocomplete="new-password">
            </div>
            <div class="field">
              <label for="rec-pass2">Ulangi password baru</label>
              <input type="password" id="rec-pass2" autocomplete="new-password">
              <div class="err" id="rec-err" role="alert"></div>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%">Simpan password baru</button>
          </form>
        </div>

        <!-- Pengunjung -->
        <div id="pane-user" role="tabpanel" aria-labelledby="tab-user" class="hidden">
          <button type="button" class="btn btn-primary" id="btn-visitor" style="width:100%">Masuk sebagai Pengunjung</button>
        </div>

      
      </div>
    </section>
  </div>

  <script src="./js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./js/supabase.js"></script>
  <script src="./js/data.js"></script>
  <script src="./js/ahp.js"></script>
  <script src="./js/storage.js"></script>
  <script src="./js/app.js"></script>
  <script src="./js/login.js"></script>
</body>
</html>
