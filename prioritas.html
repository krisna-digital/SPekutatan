<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prioritas Pembangunan · SPK Pekutatan</title>
  <link rel="icon" href="./assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body class="booting" data-page="prioritas">
  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Navigasi utama"></aside>
    <div class="scrim" id="scrim"></div>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main class="content" id="content">
        <div class="page-head">
          <div>
            <nav class="breadcrumb" aria-label="Breadcrumb"><a href="./dashboard.html">Beranda</a><span class="sep"></span><span aria-current="page">Prioritas</span></nav>
            <h1>Prioritas Pembangunan</h1>
            <p>Hasil perhitungan AHP, diurutkan dari nilai akhir terbesar. Kategori dibagi tiga bagian sama besar menurut peringkat.</p>
          </div>
          <div id="cr-chip"></div>
        </div>

        <div class="card">
          <div class="card-head"><h2>Grafik Ranking</h2></div>
          <div class="card-body"><div class="chart-box tall" id="chart-box"><canvas id="chart-rank" role="img" aria-label="Grafik ranking nilai AHP"></canvas></div></div>
        </div>

        <div class="card">
          <div class="toolbar">
            <div class="search-box grow"><span data-ic="search" data-size="18"></span><input type="search" id="q" placeholder="Cari nama, banjar, atau jenis..." aria-label="Cari"></div>
            <select id="f-kat" aria-label="Filter prioritas">
              <option value="">Semua prioritas</option>
              <option value="tinggi">Prioritas Tinggi</option>
              <option value="sedang">Prioritas Sedang</option>
              <option value="rendah">Prioritas Rendah</option>
            </select>
            <select id="f-jenis" aria-label="Filter jenis"></select>
            <select id="f-sort" aria-label="Urutkan">
              <option value="rank:asc">Urut: Ranking (1 → n)</option>
              <option value="rank:desc">Urut: Ranking (n → 1)</option>
              <option value="nama:asc">Urut: Nama (A → Z)</option>
              <option value="jenis:asc">Urut: Jenis</option>
              <option value="banjar:asc">Urut: Banjar</option>
            </select>
          </div>
          <div class="table-wrap">
            <table class="table" id="tbl" style="min-width:1100px">
              <thead id="thead"></thead>
              <tbody id="tbody"></tbody>
            </table>
          </div>
          <div class="count-line" id="count-line"></div>
        </div>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="./js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./js/supabase.js"></script>
  <script src="./js/data.js"></script>
  <script src="./js/ahp.js"></script>
  <script src="./js/storage.js"></script>
  <script src="./js/app.js"></script>
  <script src="./js/prioritas.js"></script>
</body>
</html>
