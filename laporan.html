<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Laporan Hasil SPK · SPK Pekutatan</title>
  <link rel="icon" href="./assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body class="booting" data-page="laporan">
  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Navigasi utama"></aside>

        <div class="page-head no-print">

          <div class="btn-row">

        </div>

        <article class="report" id="report" aria-label="Laporan hasil SPK"></article>
      </main>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
